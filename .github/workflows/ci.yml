name: CI

on: [ push ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Git clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # check:format compares against the upstream base commit (UPSTREAM.md)

      # Static checks on PHP 8.3 (= production web server, Docker). PHPUnit runs in the smoke job (needs MySQL);
      # PHP 8.2 compatibility of the runtime code is checked in the php82-runtime job (ADR 0007).
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM dependencies
        run: npm ci

      - name: Check formatting of fork-owned files
        run: npm run check:format

      - name: Build assets (SCSS -> CSS)
        run: npx gulp styles

      - name: PHP syntax check
        run: find application -name '*.php' -print0 | xargs -0 -n1 -P"$(nproc)" php -l > /dev/null

      - name: Validate migrations
        run: php scripts/validate-migrations.php application/migrations

      - name: Validate asset references
        run: php scripts/validate-asset-references.php

      - name: Validate spec tracker (.scratch)
        run: php scripts/scratch-index.php check

  php82-runtime:
    # Production CLI (SSH: migrations, backups) runs PHP 8.2: runtime packages and code must stay 8.2-compatible.
    runs-on: ubuntu-latest

    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd
          tools: composer

      - name: Check runtime platform requirements (lock file, without dev packages)
        run: composer check-platform-reqs --no-dev --lock

      - name: PHP 8.2 syntax check of the runtime code
        run: find application system scripts index.php -name '*.php' -print0 | xargs -0 -n1 -P"$(nproc)" php -l > /dev/null

  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Git clone
        uses: actions/checkout@v4

      - name: Create config
        run: cp config-sample.php config.php

      - name: Start stack (only services the smoke tests need)
        run: docker compose up -d --build php-fpm nginx mysql mailpit

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 90); do
            if docker compose exec -T mysql mysql -uuser -ppassword easyappointments -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready" && docker compose logs --tail=50 mysql && exit 1

      - name: Wait for PHP dependencies (composer install)
        run: |
          for i in $(seq 1 300); do
            if docker compose exec -T php-fpm test -f vendor/autoload.php 2>/dev/null; then
              echo "Composer dependencies ready"
              exit 0
            fi
            sleep 2
          done
          echo "Composer dependencies did not become ready" && docker compose logs --tail=50 php-fpm && exit 1

      - name: Install application
        run: docker compose exec -T php-fpm php index.php console install

      - name: Configure smoke-test data (mebeauty theme + name + uploaded logo)
        run: |
          docker compose exec -T mysql mysql -uuser -ppassword easyappointments -e "UPDATE ea_settings SET value='mebeauty' WHERE name='theme';"
          docker compose exec -T mysql mysql -uuser -ppassword easyappointments -e "UPDATE ea_settings SET value='MeBeauty' WHERE name='company_name';"
          docker compose exec -T mysql mysql -uuser -ppassword easyappointments -e "UPDATE ea_settings SET value='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' WHERE name='company_logo';"

      # PHPUnit boots the framework, which autoloads the database: it needs config.php and MySQL, so it runs
      # here in the Docker stack (PHP 8.3, ADR 0007) and not in the build-test job.
      - name: Run PHPUnit
        run: docker compose exec -T php-fpm composer test

      - name: Wait for application
        run: |
          for i in $(seq 1 180); do
            if curl -fsS -o /dev/null http://localhost/ 2>/dev/null; then
              echo "Application is up"
              exit 0
            fi
            sleep 2
          done
          echo "Application did not become ready" && docker compose logs --tail=50 nginx php-fpm && exit 1

      - name: Run smoke tests
        run: |
          bash tests/smoke/mebeauty-layout-smoke.sh
          bash tests/smoke/email-logo-smoke.sh
          bash tests/smoke/manage-link-smoke.sh
          bash tests/smoke/language-selector-smoke.sh
